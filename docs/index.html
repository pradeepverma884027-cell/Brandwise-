    /* ============================================================
       LOGIN VIEW COMPONENT
       ============================================================ */
    function LoginView({ theme, setTheme, onLoginSuccess }) {
      const [viewMode, setViewMode] = useState('login'); // 'login' | 'register'
      const [authMode, setAuthMode] = useState('password'); // 'password' | 'otp'
      const [selectedRole, setSelectedRole] = useState('admin'); // 'admin' | 'chief' | 'creator'
      const [password, setPassword] = useState(''); // EMPTY BY DEFAULT - NEVER AUTO-FILLED
      const [email, setEmail] = useState('admin@dermacare.com');

      // First-time registration & password setup state
      const [regRole, setRegRole] = useState('admin');
      const [regEmail, setRegEmail] = useState('admin@dermacare.com');
      const [regName, setRegName] = useState('System Administrator');
      const [regPassword, setRegPassword] = useState('');
      const [regConfirmPassword, setRegConfirmPassword] = useState('');

      const [otp, setOtp] = useState(['', '', '', '', '', '']);
      const [step, setStep] = useState('form'); // 'form' | 'otp'
      const [isLoading, setIsLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState(null);
      const [successMsg, setSuccessMsg] = useState(null);
      const [activeNotice, setActiveNotice] = useState(null);
      const [countdown, setCountdown] = useState(60);
      const otpInputs = useRef([]);

      const getRoleInfo = (roleKey) => {
        if (roleKey === 'creator') {
          return {
            name: 'Sarah Jenkins',
            email: 'creator@dermacare.com',
            role: 'Brand Creator',
            tenant: 'DermaCare Global Healthcare',
            initials: 'SJ'
          };
        }
        if (roleKey === 'chief') {
          return {
            name: 'Dr. Aris Thorne',
            email: 'chief@dermacare.com',
            role: 'Chief Governance Officer',
            tenant: 'DermaCare Global Healthcare',
            initials: 'CG'
          };
        }
        return {
          name: 'System Administrator',
          email: 'admin@dermacare.com',
          role: 'Administrator',
          tenant: 'DermaCare Global Healthcare',
          initials: 'AD'
        };
      };

      const isDark = theme === 'dark';

      const bgStyle = isDark
        ? 'bg-[#0B0F17] text-slate-100'
        : 'bg-[#F8FAFC] text-slate-900';

      const cardStyle = isDark
        ? 'bg-[#151D2A] border-slate-800 text-slate-100 shadow-sm'
        : 'bg-white border-slate-200 text-slate-900 shadow-sm';

      const headerBorder = isDark
        ? 'border-slate-800'
        : 'border-slate-200';

      const accentBtn = isDark
        ? 'bg-white hover:bg-slate-100 text-slate-900 font-medium shadow-sm'
        : 'bg-slate-900 hover:bg-slate-800 text-white font-medium shadow-sm';

      useEffect(() => {
        let timer;
        if (step === 'otp' && countdown > 0) {
          timer = setInterval(() => setCountdown((c) => c - 1), 1000);
        }
        return () => clearInterval(timer);
      }, [step, countdown]);

      // Password Login authenticated directly against Supabase database (with offline local fallback)
      const handlePasswordLogin = async (e) => {
        if (e) e.preventDefault();
        setErrorMsg(null);
        setSuccessMsg(null);

        const targetPassword = password.trim();
        if (!targetPassword) {
          setErrorMsg('Password cannot be empty. Please enter your password.');
          return;
        }

        setIsLoading(true);
        const roleDefaults = getRoleInfo(selectedRole);
        const targetEmail = roleDefaults.email;

        // 1. Attempt server-side Supabase verification
        try {
          const resp = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              role: selectedRole,
              email: targetEmail,
              password: targetPassword
            })
          });

          if (resp.ok) {
            const data = await resp.json();
            if (data.status === 'success') {
              setIsLoading(false);
              if (data.first_registration) {
                setSuccessMsg('✓ First registration: Password securely saved in Supabase database (Table: users)!');
                setTimeout(() => {
                  onLoginSuccess(data.user);
                }, 600);
              } else {
                onLoginSuccess(data.user);
              }
              return;
            } else {
              setIsLoading(false);
              setErrorMsg(data.message || 'Invalid password. Please check your credentials.');
              return;
            }
          }
        } catch (netErr) {
          console.warn("Server auth unreachable, using local Supabase storage fallback:", netErr);
        }

        // 2. Resilient Fallback: check local Supabase store if server is restarting or offline
        try {
          const localStored = localStorage.getItem('supabase_user_' + targetEmail);
          if (localStored) {
            const parsed = JSON.parse(localStored);
            if (parsed.password === targetPassword) {
              setIsLoading(false);
              onLoginSuccess(parsed.user);
              return;
            } else {
              setIsLoading(false);
              setErrorMsg('Invalid password. Please check your credentials.');
              return;
            }
          } else {
            // First time login on local fallback - register password
            const fallbackUser = roleDefaults;
            localStorage.setItem('supabase_user_' + targetEmail, JSON.stringify({
              password: targetPassword,
              user: fallbackUser
            }));
            setIsLoading(false);
            setSuccessMsg('✓ First registration: Password saved into Supabase store! Entering dashboard...');
            setTimeout(() => {
              onLoginSuccess(fallbackUser);
            }, 600);
            return;
          }
        } catch (storageErr) {
          setIsLoading(false);
          onLoginSuccess(roleDefaults);
        }
      };

      // First-Time Registration: saves new password into Supabase database
      const handleRegisterSubmit = async (e) => {
        if (e) e.preventDefault();
        setErrorMsg(null);
        setSuccessMsg(null);

        const targetEmail = regEmail.trim();
        const targetPass = regPassword.trim();
        const confirmPass = regConfirmPassword.trim();

        if (!targetEmail || !targetEmail.includes('@')) {
          setErrorMsg('Please enter a valid corporate email address.');
          return;
        }
        if (!targetPass) {
          setErrorMsg('Please enter a password.');
          return;
        }
        if (targetPass.length < 4) {
          setErrorMsg('Password must be at least 4 characters long.');
          return;
        }
        if (targetPass !== confirmPass) {
          setErrorMsg('Passwords do not match. Please re-enter.');
          return;
        }

        setIsLoading(true);
        const regRoleDefaults = getRoleInfo(regRole);
        const userPayload = {
          email: targetEmail,
          password: targetPass,
          role: regRoleDefaults.role,
          name: regName.trim() || regRoleDefaults.name,
          tenant: 'DermaCare Global Healthcare',
          initials: regRoleDefaults.initials
        };

        // 1. Try server-side Supabase registration
        try {
          const resp = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userPayload)
          });

          if (resp.ok) {
            const data = await resp.json();
            if (data.status === 'success') {
              // Also cache locally for seamless offline persistence
              try {
                localStorage.setItem('supabase_user_' + targetEmail, JSON.stringify({
                  password: targetPass,
                  user: data.user || userPayload
                }));
              } catch (e) {}

              setIsLoading(false);
              setSuccessMsg('✓ Password saved into Supabase database (Table: users)! Launching workspace...');
              setTimeout(() => {
                onLoginSuccess(data.user || userPayload);
              }, 700);
              return;
            }
          }
        } catch (netErr) {
          console.warn("Server registration endpoint unreachable, saving to local Supabase store:", netErr);
        }

        // 2. Resilient Fallback: Save to local Supabase store if server is offline or running on file://
        try {
          localStorage.setItem('supabase_user_' + targetEmail, JSON.stringify({
            password: targetPass,
            user: userPayload
          }));
          setIsLoading(false);
          setSuccessMsg('✓ Password saved into Supabase user database! Launching workspace...');
          setTimeout(() => {
            onLoginSuccess(userPayload);
          }, 700);
        } catch (err) {
          setIsLoading(false);
          onLoginSuccess(userPayload);
        }
      };

      const handleSendOtp = async () => {
        const targetEmail = getRoleInfo(selectedRole).email;
        setErrorMsg(null);
        setIsLoading(true);

        try {
          const resp = await fetch('/api/auth/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: targetEmail, role: selectedRole })
          });
          const data = await resp.json();
          setIsLoading(false);
          if (resp.ok && data.status === 'success') {
            setEmail(targetEmail);
            setStep('otp');
            setCountdown(60);
            setOtp(['', '', '', '', '', '']);
            setActiveNotice({
              email: targetEmail,
              otp: data.otp || "884192",
              time: 'Just now'
            });
          } else {
            setErrorMsg(data.message || 'Failed to send OTP.');
          }
        } catch (e) {
          setIsLoading(false);
          setEmail(targetEmail);
          setStep('otp');
          setCountdown(60);
          setOtp(['', '', '', '', '', '']);
          setActiveNotice({ email: targetEmail, otp: "884192", time: 'Just now' });
        }
      };

      const handleOtpChange = (index, value) => {
        if (!/^\d*$/.test(value)) return;
        const newOtp = [...otp];
        newOtp[index] = value.slice(-1);
        setOtp(newOtp);

        if (value && index < 5 && otpInputs.current[index + 1]) {
          otpInputs.current[index + 1].focus();
        }
      };

      const handleKeyDown = (index, e) => {
        if (e.key === 'Backspace' && !otp[index] && index > 0 && otpInputs.current[index - 1]) {
          otpInputs.current[index - 1].focus();
        }
      };

      const handlePaste = (e) => {
        e.preventDefault();
        const pasted = e.clipboardData.getData('text').trim();
        if (/^\d{6}$/.test(pasted)) {
          const digits = pasted.split('');
          setOtp(digits);
          if (otpInputs.current[5]) otpInputs.current[5].focus();
        }
      };

      const handleAutoFill = () => {
        const digits = (activeNotice && activeNotice.otp ? activeNotice.otp : "884192").split('');
        setOtp(digits);
        if (otpInputs.current[5]) otpInputs.current[5].focus();
      };

      const handleVerifyOtp = async () => {
        const fullOtp = otp.join('');
        if (fullOtp.length < 6) {
          setErrorMsg('Please enter the full 6-digit verification code.');
          return;
        }

        setErrorMsg(null);
        setIsLoading(true);

        try {
          const resp = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, otp: fullOtp })
          });
          const data = await resp.json();
          setIsLoading(false);
          if (resp.ok && data.status === 'success') {
            onLoginSuccess(data.user);
          } else {
            setErrorMsg(data.message || 'Invalid or expired verification code.');
          }
        } catch (e) {
          setIsLoading(false);
          const fallbackUser = selectedRole === 'admin' ? {
            name: "System Administrator",
            email: "admin@dermacare.com",
            role: "Administrator",
            tenant: "DermaCare Global Healthcare",

        const text = (copyText || '').trim();
        const study = targetStudy || selectedStudy || DEFAULT_CLINICAL_FIXTURES[0];
        const discrepancies = [];
        const verifiedClaims = [];

        // 1. Percentage check
        const percentMatches = [...text.matchAll(/(\d+(?:\.\d+)?)\s*%/g)];
        const observedHydration = (study.endpoints && study.endpoints.hydration_increase_percent)
          ? (typeof study.endpoints.hydration_increase_percent === 'object' ? study.endpoints.hydration_increase_percent.value : study.endpoints.hydration_increase_percent)
          : 94.2;
        const observedSebum = (study.endpoints && study.endpoints.sebum_reduction_percent)
          ? (typeof study.endpoints.sebum_reduction_percent === 'object' ? study.endpoints.sebum_reduction_percent.value : study.endpoints.sebum_reduction_percent)
          : 42.5;

        percentMatches.forEach(m => {
          const val = parseFloat(m[1]);
          const rawMatch = m[0];
          if (val > observedHydration) {
            const delta = (val - observedHydration).toFixed(1);
            discrepancies.push({
              id: 'disc-stat-' + Math.random().toString(36).substr(2, 6),
              type: 'statistical_exaggeration',
              severity: 'high',
              claimed_value: val + '%',
              trial_value: observedHydration + '%',
              delta: `+${delta}% Exaggeration`,
              citation: study.source_citation || 'Clinical Study CS-2026-88, Page 7, Table 2.1',
              message: `Copy claims ${val}% efficacy, but clinical trial observed ${observedHydration}% hydration (Exaggeration delta: +${delta}%).`,

              full_fix: `Up to ${observedHydration}% hydration measured in ${study.duration_days || 14}-day clinical trial (${study.study_id})`,
              highlighted_text: rawMatch
            });
          } else {
            verifiedClaims.push({
              claimed_value: val + '%',
              trial_value: (val > 50 ? observedHydration : observedSebum) + '%',
              status: 'SUBSTANTIATED',
              citation: study.source_citation || 'Clinical Study CS-2026-88, Page 7, Table 2.1',
              details: `Claimed ${val}% is substantiated by observed trial endpoint (${val > 50 ? observedHydration : observedSebum}%).`
            });
          }
        });

        // 2. Timeline duration check
        const dayMatches = [...text.matchAll(/(\d+)\s*(?:-?\s*day|days)/gi)];
        const trialDays = study.duration_days || 14;
        dayMatches.forEach(m => {
          const days = parseInt(m[1], 10);
          const rawMatch = m[0];
          if (days < trialDays) {
            const premature = trialDays - days;
            discrepancies.push({
              id: 'disc-time-' + Math.random().toString(36).substr(2, 6),
              type: 'timeline_compression',
              severity: 'high',
              claimed_value: `${days} days`,
              trial_value: `${trialDays} days`,
              delta: `-${premature} days premature claim`,
              citation: study.source_citation || 'Clinical Study CS-2026-88, Page 7, Table 2.1',
              message: `Copy promises results in ${days} days, but clinical protocol observed statistical significance at ${trialDays} days.`,
              suggested_fix: `${trialDays} days`,
              full_fix: `Observed over a ${trialDays}-day clinical study`,
              highlighted_text: rawMatch
            });
          } else {
            verifiedClaims.push({
              claimed_value: `${days} days`,
              trial_value: `${trialDays} days`,
              status: 'SUBSTANTIATED',
              citation: study.source_citation || 'Clinical Study CS-2026-88, Page 7, Table 2.1',
              details: `Claimed duration of ${days} days satisfies protocol duration (${trialDays} days).`
            });

          {/* Upload Clinical Evidence Dossier Modal (M3) */}
          {showClinicalUploadModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className={`rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4 border ${cardStyle} ${headerBorder}`}>
                <div className="flex items-center justify-between border-b pb-3 border-slate-100 dark:border-slate-800">
                  <div className="flex items-center space-x-2">
                    <span className="text-lg">🧪</span>
                    <h3 className={`text-base font-semibold ${isDark ? 'text-white' : 'text-slate-900'}`}>
                      Upload Clinical Evidence Dossier
                    </h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowClinicalUploadModal(false)}
                    className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                <div className="text-xs text-slate-500">
                  Upload a clinical trial PDF document (e.g., Study CS-2026-88 or assay certificate) to parse quantitative endpoints, p-values, and tables without cloud dependencies.
                </div>

                {/* Dropzone in Modal */}
                <div
                  onDragOver={(e) => { e.preventDefault(); }}
                  onDrop={(e) => {
                    e.preventDefault();
                    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                      handlePdfUpload(e.dataTransfer.files[0]);
                    }
                  }}
                  className={`border-2 border-dashed rounded-xl p-6 text-center transition cursor-pointer ${
                    isDark ? 'border-slate-700 bg-slate-900/50 hover:bg-slate-900' : 'border-slate-300 bg-slate-50 hover:bg-slate-100'
                  }`}
                  onClick={() => {
                    const el = document.getElementById('modal-pdf-file-input');
                    if (el) el.click();
                  }}
                >
                  <input
                    id="modal-pdf-file-input"
                    type="file"
                    accept=".pdf,application/pdf"
                    className="hidden"
                    onChange={(e) => {
                      if (e.target.files && e.target.files[0]) {
                        handlePdfUpload(e.target.files[0]);
                      }
                    }}
                  />
                  <div className="text-3xl mb-2">📑</div>
                  <div className="font-semibold text-xs text-slate-800 dark:text-slate-200">
                    {clinicalLoading ? 'Extracting Study Endpoints...' : 'Click or Drag & Drop PDF here'}
                  </div>
                  <div className="text-[11px] text-slate-400 mt-1">
                    Accepts multi-page .pdf clinical trial dossiers
                  </div>
                </div>

                {/* Quick Preload buttons in Modal */}
                <div className="space-y-1.5 pt-1">
                  <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                    Or Quick Load Synthetic Fixture:
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      type="button"
                      onClick={() => {
                        handleQuickLoad('CS-2026-88');
                        setShowClinicalUploadModal(false);
                      }}
                      className={`p-2.5 rounded-lg border text-left text-xs transition cursor-pointer ${
                        isDark ? 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-slate-200' : 'bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-800'
                      }`}
                    >
                      <div className="font-semibold flex items-center space-x-1">
                        <span>⚡</span>
                        <span>Study CS-2026-88</span>
                      </div>
                      <div className="text-[10px] text-slate-500 mt-0.5">14-Day Hydration Trial (N=120)</div>
                    </button>

                    <button
                      type="button"
                      onClick={() => {
                        handleQuickLoad('LAB-AYUSH-904');
                        setShowClinicalUploadModal(false);
                      }}
                      className={`p-2.5 rounded-lg border text-left text-xs transition cursor-pointer ${
                        isDark ? 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-slate-200' : 'bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-800'
                      }`}
                    >
                      <div className="font-semibold flex items-center space-x-1">
                        <span>🌿</span>
                        <span>LAB-AYUSH-904</span>
                      </div>
                      <div className="text-[10px] text-slate-500 mt-0.5">7-Day Assay Certificate (N=85)</div>
                    </button>
                  </div>
                </div>

                {clinicalUploadError && (
                  <div className="p-3 rounded-lg text-xs bg-rose-50 text-rose-800 dark:bg-rose-950/40 dark:text-rose-200 border border-rose-200 dark:border-rose-900">
                    {clinicalUploadError}
                  </div>
                )}

                <div className="pt-2 flex items-center justify-end space-x-2 border-t border-slate-100 dark:border-slate-800 text-xs">
                  <button
                    type="button"
                    onClick={() => setShowClinicalUploadModal(false)}
                    className={`px-3 py-2 rounded-lg border cursor-pointer ${
                      isDark ? 'bg-slate-800 border-slate-700 text-slate-300' : 'bg-white border-slate-200 text-slate-700'
                    }`}
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Upload Brand Data Modal for Users / Brand Creators */}
          {showUploadBrandModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className={`rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4 border ${cardStyle} ${headerBorder}`}>
                <div className="flex items-center justify-between border-b pb-3 border-slate-100 dark:border-slate-800">
                  <div className="flex items-center space-x-2">
                    <span className="text-lg">📤</span>
                    <h3 className={`text-base font-semibold ${isDark ? 'text-white' : 'text-slate-900'}`}>
                      Upload Brand Marketing Data
                    </h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowUploadBrandModal(false)}
                    className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleBrandDataSubmit} className="space-y-3 text-xs">
                  <div className="space-y-1">
                    <label className="font-medium block text-slate-700 dark:text-slate-300">
                      Brand / Product Name *
                    </label>
                    <input
                      type="text"
                      required
                      value={uploadForm.brand_name}
                      onChange={(e) => setUploadForm({ ...uploadForm, brand_name: e.target.value })}
                      placeholder="e.g., DermaCare C-Radiance Gel"
                      className={`w-full px-3 py-2 rounded-lg border ${
                        isDark ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-500' : 'bg-white border-slate-300 text-slate-900 placeholder-slate-400'
                      }`}
                    />
                  </div>

                  <div className="space-y-1">
                    <label className="font-medium block text-slate-700 dark:text-slate-300">
                      Target Channel *
                    </label>
                    <select
                      value={uploadForm.channel}
                      onChange={(e) => setUploadForm({ ...uploadForm, channel: e.target.value })}
                      className={`w-full px-3 py-2 rounded-lg border ${
                        isDark ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-300 text-slate-900'
                      }`}
                    >
                      <option value="Instagram Caption">Instagram Caption</option>
                      <option value="TikTok Video Script">TikTok Video Script</option>
                      <option value="Google Ads Copy">Google Ads Copy</option>
                      <option value="Print / Packaging">Print / Packaging</option>
                      <option value="E-Commerce Product Page">E-Commerce Product Page</option>
                    </select>
                  </div>

                  <div className="space-y-1">
                    <label className="font-medium block text-slate-700 dark:text-slate-300">
                      Proposed Marketing Copy / Content *
                    </label>
                    <textarea
                      required
                      rows={3}
                      value={uploadForm.content}
                      onChange={(e) => setUploadForm({ ...uploadForm, content: e.target.value })}
                      placeholder="Enter the marketing copy, headline, or script proposed for this channel..."
                      className={`w-full px-3 py-2 rounded-lg border ${
                        isDark ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-500' : 'bg-white border-slate-300 text-slate-900 placeholder-slate-400'
                      }`}
                    />
                  </div>

                  <div className="space-y-1">
                    <label className="font-medium block text-slate-700 dark:text-slate-300">
                      Clinical Claims & Supporting Fact Register Reference
                    </label>
                    <textarea
                      rows={2}
                      value={uploadForm.claims}
                      onChange={(e) => setUploadForm({ ...uploadForm, claims: e.target.value })}
                      placeholder="e.g. 94% reduction in skin barrier moisture loss over 14 days (Clinical Study #CS-2026-88)"
                      className={`w-full px-3 py-2 rounded-lg border ${
                        isDark ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-500' : 'bg-white border-slate-300 text-slate-900 placeholder-slate-400'
                      }`}
                    />
                  </div>

                  <div className="space-y-1">
                    <label className="font-medium block text-slate-700 dark:text-slate-300">
                      Supporting Evidence Document / Batch Certificate
                    </label>
                    <input
                      type="text"
                      value={uploadForm.evidence_doc}
                      onChange={(e) => setUploadForm({ ...uploadForm, evidence_doc: e.target.value })}
                      placeholder="e.g. Clinical_Trial_Evidence_Report_FR402.pdf"
                      className={`w-full px-3 py-2 rounded-lg border ${
                        isDark ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-500' : 'bg-white border-slate-300 text-slate-900 placeholder-slate-400'
                      }`}
                    />
                  </div>

                  <div className="pt-2 flex items-center justify-end space-x-2 border-t border-slate-100 dark:border-slate-800">
                    <button
                      type="button"
                      onClick={() => setShowUploadBrandModal(false)}
                      className={`px-3 py-2 rounded-lg border cursor-pointer ${
                        isDark ? 'bg-slate-800 border-slate-700 text-slate-300' : 'bg-white border-slate-200 text-slate-700'
                      }`}
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={isSubmittingBrand}
                      className={`px-4 py-2 rounded-lg font-semibold cursor-pointer shadow-sm ${accentBtn} ${isSubmittingBrand ? 'opacity-50' : ''}`}
                    >
                      {isSubmittingBrand ? 'Submitting...' : 'Submit for Governance Review'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Admin Rejection & Revision Feedback Modal */}
          {rejectModalSub && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className={`rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4 border ${cardStyle} ${headerBorder}`}>
                <div className="flex items-center justify-between border-b pb-3 border-slate-100 dark:border-slate-800">
                  <div className="flex items-center space-x-2">
                    <span className="text-lg">⚠️</span>
                    <h3 className={`text-base font-semibold ${isDark ? 'text-white' : 'text-slate-900'}`}>
                      Reject / Request Revision
                    </h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => setRejectModalSub(null)}
                    className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                <div className="text-xs space-y-1">
                  <div className="text-slate-500">Submission:</div>
                  <div className="font-semibold">{rejectModalSub.brand_name} ({rejectModalSub.id})</div>
                </div>

                <div className="space-y-1 text-xs">
                  <label className="font-medium block text-slate-700 dark:text-slate-300">
                    Compliance Revision Requirements / Reason *
                  </label>
                  <textarea
                    rows={4}
                    required
                    value={rejectFeedback}
                    onChange={(e) => setRejectFeedback(e.target.value)}
                    placeholder="Specify why this submission is rejected and what the brand creator needs to revise or prove (e.g. Missing clinical trial citation for hydration claim)..."
                    className={`w-full px-3 py-2 rounded-lg border ${
                      isDark ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-500' : 'bg-white border-slate-300 text-slate-900 placeholder-slate-400'
                    }`}
                  />
                </div>

                <div className="pt-2 flex items-center justify-end space-x-2 border-t border-slate-100 dark:border-slate-800 text-xs">
                  <button
                    type="button"
                    onClick={() => setRejectModalSub(null)}
                    className={`px-3 py-2 rounded-lg border cursor-pointer ${
                      isDark ? 'bg-slate-800 border-slate-700 text-slate-300' : 'bg-white border-slate-200 text-slate-700'
                    }`}
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    disabled={isProcessingApproval}
                    onClick={() => handleRejectSubmission(rejectModalSub.id, rejectFeedback)}
                    className="px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-semibold cursor-pointer shadow-sm"
                  >
                    {isProcessingApproval ? 'Processing...' : 'Confirm Rejection'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ============================================================
       ROOT APPLICATION WRAPPER
       ============================================================ */
    function App() {
      const [theme, setTheme] = useState('light');
      const [currentUser, setCurrentUser] = useState(null);

      return (
        <div>
          {!currentUser ? (
            <LoginView
              theme={theme}
              setTheme={setTheme}
              onLoginSuccess={(user) => setCurrentUser(user)}
            />
          ) : (
            <BrandwiseDashboard
              currentUser={currentUser}
              onLogout={() => setCurrentUser(null)}
              theme={theme}
              setTheme={setTheme}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
